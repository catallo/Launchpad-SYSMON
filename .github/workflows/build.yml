name: Test, build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build static Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/launchpad-sysmon-linux-amd64 ./cmd/launchpad-sysmon
      - name: CLI help smoke test (no MIDI access)
        run: ./dist/launchpad-sysmon-linux-amd64 --help
      - name: Generate and verify SHA-256 checksum
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum launchpad-sysmon-linux-amd64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launchpad-sysmon-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'catallo/Launchpad-SYSMON'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version tag is on master history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v${number}\\.${number}\\.${number}(-${identifier}(\\.${identifier})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
          [[ "$TAG" =~ $pattern ]]
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launchpad-sysmon-binaries
          path: dist
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test -f dist/launchpad-sysmon-linux-amd64
          (cd dist && sha256sum --check SHA256SUMS)
          extra=()
          version="${TAG%%+*}"
          if [[ "$version" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${extra[@]}"
